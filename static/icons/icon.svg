<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="100%" stop-color="#181a28"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#orbitGrad)" stroke-width="12" stroke-opacity="0.25" filter="url(#glow)"/>

  <!-- Main Orbit Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#orbitGrad)" stroke-width="20" stroke-linecap="round" stroke-dasharray="750 250"/>

  <!-- Inner Ambient Glow -->
  <circle cx="256" cy="256" r="100" fill="#6366f1" fill-opacity="0.12" filter="url(#glow)"/>

  <!-- Centered Checkmark -->
  <path d="M190 260 L235 305 L325 210" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Orbit Particle Dot -->
  <circle cx="395" cy="180" r="16" fill="#10b981" filter="url(#glow)"/>
</svg>
